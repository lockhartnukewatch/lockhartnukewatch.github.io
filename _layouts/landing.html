---
layout: default
---

<div class="landing-wrapper">
  <main class="landing-content" role="main">
    <article class="page" itemscope itemtype="https://schema.org/CreativeWork">
      {% if page.title %}
      <header>
        <h1 id="page-title" class="page__title" itemprop="headline">{{ page.title | markdownify | remove: "<p>" | remove: "</p>" }}</h1>
      </header>
      {% endif %}

      <section class="page__content" itemprop="text">
        {{ content }}
      </section>
    </article>
  </main>

  <aside class="landing-sidebar">
    {% if page.sidebar_collections %}
      {% include sidebar-collection.html collections=page.sidebar_collections %}
    {% endif %}
  </aside>
</div>
